services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetingmind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/meetingmind
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/app/storage_uploads
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --quiet alembic asyncpg &&
             echo 'Running migrations...' &&
             alembic upgrade head &&
             echo 'Starting API...' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:15-alpine
    container_name: meetingmind-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=meetingmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetingmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meetingmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meetingmind-worker
    restart: unless-stopped
    command: ["python", "run_worker.py"]
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/meetingmind
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/app/storage_uploads
    depends_on:
      - redis
      - postgres
      - api

volumes:
  uploads_data:
  redis_data:
  postgres_data:
