services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meetingmind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/app/storage_uploads
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: meetingmind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: meetingmind-worker
    restart: unless-stopped
    command: ["python", "run_worker.py"]
    env_file:
      - ./server/.env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - uploads_data:/app/storage_uploads
    depends_on:
      - redis
      - api

volumes:
  uploads_data:
  redis_data:
